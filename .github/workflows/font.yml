name: Font
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf" -o app/src/main/assets/AmiriQuran.ttf
          ls -la app/src/main/assets/AmiriQuran.ttf
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Amiri Quran font (OFL)"
          git pull -q --rebase origin main || true
          git push
