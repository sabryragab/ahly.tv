name: Check channels and radio
on:
  schedule: [{ cron: '17 */4 * * *' }]   # every 4 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_sources.py
      - name: Save working lists
        run: |
          git config user.name "ahly-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update working channels and radio" && git push)
