name: Build APK
on:
  push:
    paths-ignore: ["data/**", "scripts/**", "docs/**", ".github/workflows/check.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME is set)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bundle hls.js into the app (works even if the CDN is slow)
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js -o app/src/main/assets/hls.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js -o app/src/main/assets/qrcode.min.js
          python3 scripts/build_tv.py
      - name: Test the app in Chrome (lists load, streams play, remote keys work)
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          { pip install playwright==1.47.0 && python -m playwright install --with-deps chrome; } > install.log 2>&1 || { echo "INSTALL FAILED"; tail -25 install.log; } > test-report.txt
          [ -s test-report.txt ] && exit 1
          python tests/e2e.py app/src/main/assets/index.html
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: gradle assembleDebug --stacktrace
      - name: Publish APK as latest release
        if: github.ref == 'refs/heads/main' && steps.e2e.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AhlyTV.apk
          gh release delete latest --yes --cleanup-tag || true
          { echo "آخر نسخة من التطبيق"; echo; echo '```'; cat test-report.txt; echo '```'; } > notes.md
          gh release create latest AhlyTV.apk shot-*.png --title "الأهلي TV" --notes-file notes.md --latest
      - name: Save test report
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          touch test-report.txt
          gh release delete test-report --yes --cleanup-tag || true
          gh release create test-report --prerelease --title "Test report" --notes "$(echo '```'; cat test-report.txt; echo '```')" $(ls shot-*.png 2>/dev/null)
      - if: steps.e2e.outcome != 'success'
        run: exit 1
