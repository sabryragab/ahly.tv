name: Build APK
on:
  push:
    paths-ignore: ["data/**", "scripts/**", ".github/workflows/check.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME is set)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AhlyTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as latest release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AhlyTV.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AhlyTV.apk --title "الأهلي TV" --notes "آخر نسخة من التطبيق" --latest
